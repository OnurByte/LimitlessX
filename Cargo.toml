[workspace]
members = ["crates/core", "crates/fxtwitter", "crates/storage", "crates/runtime", "crates/ui", "crates/xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
limitless-core = { path = "crates/core" }
limitless-fxtwitter = { path = "crates/fxtwitter" }
limitless-storage = { path = "crates/storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
