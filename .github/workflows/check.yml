name: Verify and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          curl -fsSL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o /tmp/bindgen.tar.gz
          tar -xzf /tmp/bindgen.tar.gz -C /tmp
          echo /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl >> "$GITHUB_PATH"
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo /tmp/binaryen-version_133/bin >> "$GITHUB_PATH"
      - name: Rust validation
        run: |
          cargo fmt --all -- --check
          cargo xtask test
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --target wasm32-unknown-unknown -p limitless-runtime -p limitless-ui --locked -- -D warnings
      - name: Build validated browser packages and source archive
        run: cargo xtask package
      - name: Install browser harness
        run: |
          python3 -m pip install -r tests/browser/requirements.txt
          python3 -m playwright install --with-deps chromium firefox
      - name: Chromium extension integration
        run: |
          python3 tests/browser/smoke.py
          python3 tests/browser/inline.py
          python3 tests/browser/inline_contracts.py
          python3 tests/browser/native_fidelity.py
          python3 tests/browser/lifecycle.py
          python3 tests/browser/infinite_scroll.py
      - name: Firefox extension integration
        run: |
          curl -fsSL https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o /tmp/geckodriver.tar.gz
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
          export GECKODRIVER=/tmp/geckodriver
          python3 tests/browser/firefox_smoke.py
          python3 tests/browser/firefox_inline.py
      - uses: actions/upload-artifact@v4
        with:
          name: limitlessx-development-packages
          path: dist/releases/*
